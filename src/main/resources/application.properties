spring.application.name=stockreserve
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockreserve}
spring.datasource.username=${DB_USER:stockreserve}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
management.endpoints.web.exposure.include=health
reservation.ttl=${RESERVATION_TTL:PT15M}
reservation.expiration.enabled=${RESERVATION_EXPIRATION_ENABLED:true}
reservation.expiration.poll-interval-ms=${RESERVATION_EXPIRATION_POLL_INTERVAL_MS:1000}
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=10s
