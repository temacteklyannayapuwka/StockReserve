spring.application.name=stockreserve
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockreserve}
spring.datasource.username=${DB_USER:stockreserve}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
